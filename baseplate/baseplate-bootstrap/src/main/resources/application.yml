spring:
  application:
    name: baseplate
  datasource:
    url: ${BASEPLATE_DB_URL:jdbc:postgresql://127.0.0.1:5432/baseplate_dev?sslmode=disable}
    username: ${BASEPLATE_DB_USER:postgres}
    password: ${BASEPLATE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: false
  servlet:
    multipart:
      # 技能包上传：一个 zip 里可能有多个技能和脚本文件
      max-file-size: 20MB
      max-request-size: 50MB
  data:
    redis:
      host: ${BASEPLATE_REDIS_HOST:127.0.0.1}
      port: ${BASEPLATE_REDIS_PORT:6379}
      password: ${BASEPLATE_REDIS_PASSWORD:}
      timeout: 3s

baseplate:
  registry-fail-fast: true
  migration-plan-path: build/migration-plan.json
  tenant:
    mode: shared-column
  redis:
    enabled: true
    fallback-to-memory: true
    key-prefix: "bp:"
  security:
    trace-header: X-Trace-Id
  agent:
    max-iters: 4
    stream-timeout-seconds: 120
    skill-dir: ./skills
    # 内部工具暴露方式：cli（baseplate 命令行）/ meta（三个元工具）/ direct（全量直挂）
    tool-exposure-mode: ${BASEPLATE_AGENT_TOOL_EXPOSURE_MODE:cli}
    # 是否自动挂载对应的入口技能（工具检索 / 工具元调用）
    tool-exposure-skill: ${BASEPLATE_AGENT_TOOL_EXPOSURE_SKILL:true}
  identity:
    default-tenant: default
    password-expire-enabled: false
    password-expire-days: 90
    max-failed-attempts: 5
    lock-minutes: 15
  platform:
    token-ttl: 2h
    timestamp-window: 5m
    sandbox-enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,ports
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.baseplate: INFO
