id: platform
display-name: 开放平台
version: 1.0.0
requires: "baseplate-api >=1.0.0,<2.0.0"
root-package: com.example.baseplate.platform
enabled-by-default: true

permissions:
  - { code: "openapi:view", label: 查看开放应用, type: MENU }
  - { code: "openapi:create", label: 创建应用, type: BUTTON }
  - { code: "openapi:update", label: 编辑应用, type: BUTTON }
  - { code: "openapi:rotate", label: 轮换密钥, type: BUTTON }
  - { code: "openapi:log", label: 查看调用日志, type: BUTTON }

menus:
  - { path: /platform/apps, label: 开放平台, permission: "openapi:view", icon: Connection }

rule-fields:
  - { name: appKey, label: 应用Key, type: STRING }
  - { name: latencyMs, label: 耗时(ms), type: NUMBER }

config-keys:
  - baseplate.platform.token-ttl
  - baseplate.platform.timestamp-window
  - baseplate.platform.sandbox-enabled

flyway-locations:
  - classpath:db/migration/platform

openapi-group: platform-v1
